# HackCard ESP32 — Official Documentation
# Source of truth: HackCard-ESP32 firmware repository
# Live: https://hardwarehackspace.github.io/hackcard-docs/

site_name: HackCard Docs
site_description: Official documentation for HackCard ESP32-S3 hardware — Kickstarter backer and developer guide
site_url: https://hardwarehackspace.github.io/hackcard-docs/
repo_url: https://github.com/hardwarehackspace/hackcard-docs
repo_name: hackcard-docs
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: slate
      primary: black
      accent: yellow
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: yellow
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - toc.follow

plugins:
  - search:
      separator: '[\s\-]+'

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

nav:
  - Home: index.md

  - Getting Started:
      - getting-started/introduction.md
      - What's Included: getting-started/whats-included.md
      - Hardware Versions: getting-started/hardware-versions.md
      - First Setup: getting-started/first-setup.md
      - First Program: getting-started/first-program.md
      - Backer Checklist: getting-started/backer-checklist.md

  - Hardware:
      - hardware/overview.md
      - Pinout: hardware/pinout.md
      - Component Map: hardware/component-map.md
      - ESP32: hardware/esp32.md
      - SD Card: hardware/sd-card.md
      - NFC: hardware/nfc.md
      - Buttons & Reset: hardware/buttons.md
      - Power: hardware/power.md

  - Software:
      - software/installation.md
      - Firmware: software/firmware.md
      - Arduino Setup: software/arduino-setup.md
      - Libraries: software/libraries.md
      - Configuration: software/configuration.md
      - Partition Table: software/partition-table.md
      - Storage & Logs: software/storage-and-logs.md
      - CLI Reference: software/cli-reference.md
      - Web Dashboard: software/web-dashboard.md
      - Updates: software/updates.md

  - Features:
      - Feature Guides: features/index.md
      - RGB Ring: features/rgb.md
      - Buzzer: features/buzzer.md
      - Wi-Fi: features/wifi.md
      - NFC Reader: features/nfc-reader.md
      - SD Card: features/sd-card.md
      - Device Modes: features/device-modes.md
      - BLE (Lab): features/ble.md
      - USB HID (Lab): features/usb-hid.md

  - Tutorials:
      - tutorials/beginner.md
      - Beginner — Web Terminal: tutorials/beginner/web-terminal.md
      - Beginner — Diagnostics: tutorials/beginner/diagnostics.md
      - Beginner — Personalize Profile: tutorials/beginner/personalize-profile.md
      - Beginner — Device Modes: tutorials/beginner/device-modes.md
      - Beginner — Activity Log: tutorials/beginner/activity-log.md
      - Wi-Fi: tutorials/wifi.md
      - NFC: tutorials/nfc.md
      - SD Card: tutorials/sd-card.md
      - RGB: tutorials/rgb.md
      - Buzzer: tutorials/buzzer.md
      - Advanced: tutorials/advanced.md
      - Advanced — USB HID: tutorials/advanced/usb-hid.md
      - Advanced — BLE Contact: tutorials/advanced/ble-contact-card.md
      - Advanced — NFC Dump + Clone: tutorials/advanced/nfc-dump-clone.md

  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md

  - Resources:
      - resources/github.md
      - Firmware: resources/firmware.md
      - Schematics: resources/schematics.md
      - Pinout: resources/pinout.md
      - Datasheets: resources/datasheets.md
      - Quick Reference: resources/quick-reference.md
      - Changelog: resources/changelog.md
      - Legal & Ethical Use: resources/legal-ethical-use.md

extra:
  generator: false
  firmware_version: "0.21.2"
  firmware_repo: https://github.com/hardwarehackspace/HackCard-ESP32
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hardwarehackspace/hackcard-docs
      name: Documentation repository

